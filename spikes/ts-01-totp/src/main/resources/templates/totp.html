<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>認証コードの入力</title></head>
<body>
<main>
    <h1>認証コードの入力（A-02）</h1>
    <p th:if="${param.error}" role="alert">認証コードが正しくありません。</p>
    <form th:action="@{/login/totp}" method="post">
        <label>認証コード（6 桁）または回復コード
            <input type="text" name="code" autocomplete="one-time-code" inputmode="numeric" th:value="${code}"></label>
        <button type="submit">確認</button>
    </form>
</main>
</body>
</html>
