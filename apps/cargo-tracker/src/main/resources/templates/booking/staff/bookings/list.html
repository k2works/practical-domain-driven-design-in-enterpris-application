<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/staff :: layout(~{::title}, ~{::main}, ~{}, 'bookings')}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>予約一覧 - cargo-tracker</title>
</head>
<body>
<main>
    <h1>予約一覧</h1>
    <!--/* S-10 の最小の表示（Bolt 25b）。絞り込み・ページ送り・変更・取消申請の状況は US-05（W11） */-->
    <p th:if="${#lists.isEmpty(bookings)}">確定した予約はまだありません。本予約は<a th:href="@{/staff/transport-requests}">見積依頼の受付一覧</a>の「予約の確定待ち」から確定できます。</p>
    <p th:if="${truncated}" th:text="|新しい ${limit} 件だけを示しています。|">新しい 50 件だけを示しています。</p>
    <div th:unless="${#lists.isEmpty(bookings)}" class="table-scroll" tabindex="0" role="region"
         aria-labelledby="bookings-caption">
        <table class="table">
            <caption id="bookings-caption">確定した予約（確定時刻の新しい順）</caption>
            <thead>
            <tr>
                <th scope="col">追跡番号</th>
                <th scope="col">見積り</th>
                <th scope="col">確定時刻</th>
                <th scope="col">追跡の開始</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="booking : ${bookings}">
                <td><a th:href="@{/staff/bookings/{trackingNumber}(trackingNumber=${booking.trackingNumber()})}"
                       th:text="${booking.trackingNumber()}">CTABCDEFGH2345</a></td>
                <td th:text="${booking.quotation()}">TR-2026-0001 見積 1</td>
                <td th:text="${booking.committedAt()}">2026-10-08 09:30 Asia/Tokyo（UTC+09:00）（UTC 2026-10-08 00:30）</td>
                <td th:text="${booking.trackingStart()}">処理中</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
