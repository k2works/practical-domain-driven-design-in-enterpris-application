<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/customer :: layout(~{::title}, ~{::main}, ~{}, 'inquiries')}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問い合わせ - cargo-tracker</title>
</head>
<body>
<main>
    <h1>問い合わせ</h1>
    <!--/* C-14（Bolt 42-2、US-23 AC1・AC4）。自社の問い合わせを起票の新しい順に示す。詳細と再開は C-15（Bolt 42-3） */-->
    <p>問い合わせの受付時間: <span th:text="${receptionHours}">平日 09:00〜18:00 Asia/Tokyo（UTC+09:00）</span></p>
    <p th:if="${#lists.isEmpty(serviceCases)}">問い合わせはまだありません。</p>
    <p th:if="${truncated}" th:text="|新しい ${limit} 件だけを示しています。|">新しい 200 件だけを示しています。</p>
    <div th:unless="${#lists.isEmpty(serviceCases)}" class="table-scroll" tabindex="0" role="region"
         aria-labelledby="inquiries-caption">
        <table class="table">
            <caption id="inquiries-caption">自社の問い合わせ（新しい順）</caption>
            <thead>
            <tr>
                <th scope="col">受付番号</th>
                <th scope="col">状態</th>
                <th scope="col">次回更新日時</th>
                <th scope="col">最新の回答</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="serviceCase : ${serviceCases}">
                <td th:text="${serviceCase.number()}">SC-2026-0057</td>
                <td th:text="${serviceCase.status()}">受付済み</td>
                <td th:text="${serviceCase.nextUpdateAt()}">2026-11-17 14:00 Asia/Tokyo（UTC+09:00）</td>
                <td th:text="${serviceCase.latestAnswer()}">回答はまだありません。</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
