<!DOCTYPE html>
<!--/* 認証アプリの登録の案内（Bolt 31。Bolt 31b で A-07 認証アプリの登録に置き換える。UI 設計「A-07」）。
       TOTP を登録していない利用者は、password が正しくても業務の画面を開けない */-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/public :: layout(~{::title}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>認証アプリの登録が必要です - cargo-tracker</title>
</head>
<body>
<main>
    <h1>認証アプリの登録が必要です</h1>
    <p>ログインするには、認証アプリの登録が必要です。認証アプリの登録の画面は準備中です。</p>
    <p>荷主の方は担当営業に、社内の方はシステム管理者にお問い合わせください。</p>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-outline-secondary">ログアウト</button>
    </form>
</main>
</body>
</html>
