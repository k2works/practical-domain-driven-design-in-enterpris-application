<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/staff :: layout(~{::title}, ~{::main}, ~{}, 'kpi-observations')}">
<head>
    <meta charset="UTF-8">
    <title>KPI 計測記録 - cargo-tracker</title>
</head>
<body>
<main>
    <h1>KPI 計測記録</h1>
    <p th:if="${#lists.isEmpty(observations)}">まだ記録はありません。</p>
    <div th:unless="${#lists.isEmpty(observations)}" class="table-scroll" tabindex="0" role="region"
         aria-label="輸送要求ごとの KPI-01 の時刻とリードタイム">
        <table class="table">
            <caption>輸送要求ごとの KPI-01 の時刻とリードタイム</caption>
            <thead>
            <tr>
                <th scope="col">業務番号</th>
                <th scope="col">提出時刻</th>
                <th scope="col">最初の提示時刻</th>
                <th scope="col">KPI-01 リードタイム</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="observation : ${observations}">
                <td th:text="${observation.transportRequestNumber}">TR-2026-0001</td>
                <td th:text="${observation.submittedAt}">2026-10-05 10:00 Asia/Tokyo（UTC+09:00）（UTC 2026-10-05 01:00）</td>
                <td th:if="${observation.firstPresentedAt != null}" th:text="${observation.firstPresentedAt}">2026-10-05 13:30 Asia/Tokyo（UTC+09:00）（UTC 2026-10-05 04:30）</td>
                <td th:unless="${observation.firstPresentedAt != null}">未提示</td>
                <td th:if="${observation.leadTime != null}" th:text="${observation.leadTime}">3 時間 30 分</td>
                <td th:unless="${observation.leadTime != null}"><span aria-hidden="true">—</span><span class="visually-hidden">未提示のため算出しない</span></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
