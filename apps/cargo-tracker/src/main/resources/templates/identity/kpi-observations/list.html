<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KPI 計測記録 - cargo-tracker</title>
</head>
<body>
<main>
    <h1>KPI 計測記録</h1>
    <p th:if="${#lists.isEmpty(observations)}">まだ記録はありません。</p>
    <table th:unless="${#lists.isEmpty(observations)}">
        <caption>輸送要求ごとの提出時刻（KPI-01 の開始時刻）</caption>
        <thead>
        <tr>
            <th scope="col">業務番号</th>
            <th scope="col">提出時刻（UTC）</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="observation : ${observations}">
            <td th:text="${observation.transportRequestNumber}">TR-2026-0001</td>
            <td th:text="${observation.submittedAt}">2026-10-05 01:00:00 +00:00</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
