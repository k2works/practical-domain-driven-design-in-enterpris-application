<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/staff :: layout(~{::title}, ~{::main}, ~{}, 'users')}">
<head>
    <meta charset="UTF-8">
    <title>利用者の詳細 - cargo-tracker</title>
</head>
<body>
<main>
    <h1 th:text="|利用者の詳細　${user.displayName}|">利用者の詳細　佐藤</h1>
    <div th:if="${notice != null}" class="alert alert-success" role="status" th:text="${notice}">
        役割を変更しました。相手の次の操作から効きます。
    </div>
    <div th:if="${error != null}" class="alert alert-danger" role="alert" tabindex="-1" id="error-summary">
        <h2 class="h6">役割を変更できませんでした</h2>
        <ul class="mb-0">
            <li><a href="#roles" th:text="${error}">自分の役割は変更できません。</a></li>
        </ul>
    </div>
    <dl class="row">
        <dt class="col-sm-3">企業</dt>
        <dd class="col-sm-9" th:text="|${user.companyName}（${companyKindName}）|">A 社（運用する会社）</dd>
        <dt class="col-sm-3">メールアドレス</dt>
        <dd class="col-sm-9" th:text="${user.email.value}">sato@example.com</dd>
        <dt class="col-sm-3">利用状態</dt>
        <dd class="col-sm-9" th:text="${user.status.name() == 'ACTIVE'} ? '利用中' : '利用停止'">利用中</dd>
        <dt class="col-sm-3">今の役割</dt>
        <dd class="col-sm-9">
            <ul class="list-unstyled mb-0">
                <li th:each="role : ${T(com.example.cargotracker.shared.domain.Role).values()}"
                    th:if="${user.roles.contains(role)}" th:text="${role.displayName}">営業担当者</li>
            </ul>
        </dd>
    </dl>
    <form method="get" th:action="@{/staff/users/{id}/role-changes/confirmation(id=${user.id.value})}">
        <input type="hidden" name="version" th:value="${user.version}">
        <fieldset id="roles" th:attr="aria-describedby=${error != null} ? 'roles-error' : null">
            <legend class="h5">役割</legend>
            <p th:if="${error != null}" id="roles-error" class="text-danger" th:text="${error}">自分の役割は変更できません。</p>
            <div class="form-check" th:each="option : ${roleOptions}">
                <input class="form-check-input" type="checkbox" name="roles"
                       th:id="|role-${option.role.name()}|" th:value="${option.role.name()}"
                       th:checked="${option.selected}"
                       th:attr="aria-describedby=${option.fit} ? null : |role-${option.role.name()}-unfit|">
                <label class="form-check-label" th:for="|role-${option.role.name()}|"
                       th:text="${option.role.displayName}">営業担当者</label>
                <span th:unless="${option.fit}" class="form-text" th:id="|role-${option.role.name()}-unfit|"
                      th:text="|（${companyKindName}の利用者には付けられません）|">（運用する会社の利用者には付けられません）</span>
            </div>
        </fieldset>
        <button type="submit" class="btn btn-primary mt-3">変更内容を確認する</button>
    </form>
    <p class="mt-3"><a th:href="@{/staff/users}">利用者の一覧へ戻る</a></p>
</main>
</body>
</html>
