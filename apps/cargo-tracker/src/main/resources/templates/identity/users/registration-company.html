<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/staff :: layout(~{::title}, ~{::main}, ~{::script}, 'users')}">
<head>
    <meta charset="UTF-8">
    <title>利用者の登録 - cargo-tracker</title>
    <!--/* エラー要約へフォーカスを移す（共通部品「エラー要約」。リンクの先へはブラウザの素の移動で移る） */-->
    <script th:src="@{/js/transport-request-form.js}" defer></script>
</head>
<body>
<main>
    <h1>利用者の登録</h1>
    <!--/* エラー要約（共通部品と同じ形。Bolt 38b3b）。リンクは「表示名: 文言」で、企業の群の最初の選択肢へ */-->
    <div id="error-summary" th:if="${summary != null}" tabindex="-1" role="alert" aria-labelledby="error-summary-title">
        <h2 id="error-summary-title" th:text="${summary.title}">利用者を登録できませんでした</h2>
        <ul>
            <li th:each="item : ${summary.items}">
                <a th:if="${item.href != null}" th:href="${item.href}" th:text="${item.text}">企業: 登録する企業を 1 つ選んでください。</a>
                <span th:unless="${item.href != null}" th:text="${item.text}">企業: 登録する企業を 1 つ選んでください。</span>
            </li>
        </ul>
    </div>
    <p th:if="${#lists.isEmpty(companyOptions)}">登録できる企業がありません。</p>
    <!--/* 企業だけを URL に持つ GET。ラジオを選ばずに送ると企業の値が送られないので、印 step で初めて開いたときと見分ける */-->
    <form th:unless="${#lists.isEmpty(companyOptions)}" method="get" th:action="@{/staff/users/new}">
        <input type="hidden" name="step" value="company">
        <fieldset id="company"
                  th:attr="aria-describedby=${companyError != null} ? 'company-error' : null,aria-invalid=${companyError != null} ? 'true' : null">
            <legend class="h6">企業</legend>
            <p th:if="${companyError != null}" id="company-error" class="text-danger" th:text="${companyError}">登録する企業を 1 つ選んでください。</p>
            <p class="form-text">管理範囲の、利用中の企業から選びます。</p>
            <div class="form-check" th:each="option : ${companyOptions}">
                <input class="form-check-input" type="radio" name="companyId"
                       th:id="|company-${option.id}|" th:value="${option.id}">
                <label class="form-check-label" th:for="|company-${option.id}|" th:text="${option.label}">A 社（運用する会社）</label>
            </div>
        </fieldset>
        <button type="submit" class="btn btn-primary mt-3">次へ</button>
    </form>
    <p class="mt-3"><a th:href="@{/staff/users}">利用者の一覧へ戻る</a></p>
</main>
</body>
</html>
