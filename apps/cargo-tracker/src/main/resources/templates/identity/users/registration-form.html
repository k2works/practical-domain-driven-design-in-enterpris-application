<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/staff :: layout(~{::title}, ~{::main}, ~{::script}, 'users')}">
<head>
    <meta charset="UTF-8">
    <title>利用者の登録 - cargo-tracker</title>
    <!--/* エラー要約へフォーカスを移す（共通部品「エラー要約」。リンクの先へはブラウザの素の移動で移る） */-->
    <script th:src="@{/js/transport-request-form.js}" defer></script>
</head>
<body>
<main>
    <h1 th:text="|利用者の登録　${companyLabel}|">利用者の登録　A 社（運用する会社）</h1>
    <!--/* エラー要約（共通部品と同じ形。Bolt 38b3b）。画面で見る誤りはまとめ、欄の順に「表示名: 文言」で各欄へリンクする */-->
    <div id="error-summary" th:if="${summary != null}" tabindex="-1" role="alert" aria-labelledby="error-summary-title">
        <h2 id="error-summary-title" th:text="${summary.title}">利用者を登録できませんでした</h2>
        <ul>
            <li th:each="item : ${summary.items}">
                <a th:if="${item.href != null}" th:href="${item.href}" th:text="${item.text}">付ける役割: 1 つ以上選んでください。</a>
                <span th:unless="${item.href != null}" th:text="${item.text}">付ける役割: 1 つ以上選んでください。</span>
            </li>
        </ul>
    </div>
    <!--/* メールアドレスと表示名を URL に載せないよう POST で確認へ進む（Bolt 38b3 の開始準備の決定 (2)） */-->
    <form method="post" th:action="@{/staff/users/new/confirmation}">
        <input type="hidden" name="companyId" th:value="${company.id.value}">
        <fieldset id="roles"
                  th:attr="aria-describedby=${errors['roles'] != null} ? 'roles-error' : null,aria-invalid=${errors['roles'] != null} ? 'true' : null">
            <legend class="h6">付ける役割</legend>
            <p th:if="${errors['roles'] != null}" id="roles-error" class="text-danger" th:text="${errors['roles']}">1 つ以上選んでください。</p>
            <p class="form-text" th:text="|${companyLabel}の利用者に付けられる役割です。システム管理者・監査担当者の役割は、この画面では付けられません。|">
                A 社（運用する会社）の利用者に付けられる役割です。
            </p>
            <div class="form-check" th:each="option : ${roleOptions}">
                <input class="form-check-input" type="checkbox" name="roles"
                       th:id="|role-${option.role.name()}|" th:value="${option.role.name()}"
                       th:checked="${option.selected}">
                <label class="form-check-label" th:for="|role-${option.role.name()}|"
                       th:text="${option.role.displayName}">営業担当者</label>
            </div>
        </fieldset>
        <div class="mt-3">
            <label class="form-label" for="email">メールアドレス</label>
            <p th:if="${errors['email'] != null}" id="email-error" class="text-danger" th:text="${errors['email']}">入力してください。</p>
            <!--/* 本人の情報ではないので autocomplete を付けない。形はサーバーが確かめる（ブラウザの検査で要約を飛ばさない） */-->
            <input class="form-control" type="text" inputmode="email" spellcheck="false" id="email" autocapitalize="none" name="email"
                   th:value="${email}"
                   th:attr="aria-describedby=${errors['email'] != null} ? 'email-error' : null,aria-invalid=${errors['email'] != null} ? 'true' : null">
        </div>
        <div class="mt-3">
            <label class="form-label" for="display-name">表示名</label>
            <p th:if="${errors['displayName'] != null}" id="display-name-error" class="text-danger" th:text="${errors['displayName']}">入力してください。</p>
            <input class="form-control" type="text" id="display-name" name="displayName" th:value="${displayName}"
                   th:attr="aria-describedby=${errors['displayName'] != null} ? 'display-name-error' : null,aria-invalid=${errors['displayName'] != null} ? 'true' : null">
        </div>
        <button type="submit" class="btn btn-primary mt-3">確認する</button>
    </form>
    <p class="mt-3"><a th:href="@{/staff/users/new}">企業を選び直す</a></p>
</main>
</body>
</html>
