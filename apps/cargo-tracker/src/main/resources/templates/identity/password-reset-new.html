<!DOCTYPE html>
<!--/* A-06 password の再設定と初回の設定（US-18 AC8 の後半、SEC-04・SEC-05、UI 設計「A-06」。Bolt 33a。初回の設定は Bolt 38b4。見出しと説明は
       controller が用途から選んで渡す）。リンクを開いた後のトークンのない URL で開く。
       条件の数値は password の方針の定数から描く。誤りは欄の下に示し（novalidate）、誤りのときは title に「エラー: 」を付けて誤りの欄に
       フォーカスを置く。2 つの欄に入れた値は応答に書き戻さない */-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/public :: layout(~{::title}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title th:text="${newPasswordError != null or confirmPasswordError != null} ? |エラー: ${heading} - cargo-tracker| : |${heading} - cargo-tracker|">password の再設定 - cargo-tracker</title>
</head>
<body>
<main>
    <h1 th:text="${heading}">password の再設定</h1>
    <p th:text="${description}">新しい password を入力してください。</p>
    <ul id="password-rules">
        <li th:text="|${minLength} 文字以上 ${maxLength} 文字まで。空白や全角の文字も使えます。|">12 文字以上 64 文字まで。空白や全角の文字も使えます。</li>
        <li th:text="|全角の文字（かな・漢字など）は 1 文字を 3 文字分として数え、合わせて ${maxBytes} 文字分までです。|">全角の文字（かな・漢字など）は 1 文字を 3 文字分として数え、合わせて 72 文字分までです。</li>
        <li>よく使われている password は使えません。</li>
    </ul>
    <form th:action="@{/password-reset/new}" method="post" novalidate>
        <div class="mb-3">
            <label for="newPassword" class="form-label">新しい password</label>
            <input type="password" id="newPassword" name="newPassword" class="form-control" autocomplete="new-password" required
                   th:classappend="${newPasswordError != null} ? 'is-invalid'"
                   th:attr="aria-invalid=${newPasswordError != null} ? 'true' : null,aria-describedby=${newPasswordError != null} ? 'newPassword-error password-rules' : 'password-rules',autofocus=${newPasswordError != null} ? 'autofocus' : null">
            <p id="newPassword-error" class="form-text text-danger" th:if="${newPasswordError != null}" th:text="${newPasswordError}">
                12 文字以上の password を入力してください。</p>
        </div>
        <div class="mb-3">
            <label for="confirmPassword" class="form-label">新しい password（確認）</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" autocomplete="new-password" required
                   th:classappend="${confirmPasswordError != null} ? 'is-invalid'"
                   th:attr="aria-invalid=${confirmPasswordError != null} ? 'true' : null,aria-describedby=${confirmPasswordError != null} ? 'confirmPassword-error' : null,autofocus=${confirmPasswordError != null} ? 'autofocus' : null">
            <p id="confirmPassword-error" class="form-text text-danger" th:if="${confirmPasswordError != null}" th:text="${confirmPasswordError}">
                確認の欄に、新しい password と同じものを入力してください。</p>
        </div>
        <button type="submit" class="btn btn-primary">password を設定する</button>
    </form>
    <p class="mt-4"><a th:href="@{/login}">ログインに戻る</a></p>
</main>
</body>
</html>
