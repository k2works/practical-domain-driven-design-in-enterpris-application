<!DOCTYPE html>
<!--/* A-03 再認証の案内（US-18 AC5、UI 設計「A-03」）。業務データを出さない。失効の前の警告と延長は共通のレイアウト（Bolt 32b）。
       失効の後にログインし直すと開いていた画面へ戻る（Bolt 32e）。
       入力の保持は Bolt 32f */-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/public :: layout(~{::title}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>もう一度ログインしてください - cargo-tracker</title>
</head>
<body>
<!--/* 送信が拒まれた画面の印（Bolt 32f）。入力の控えに「拒まれた」印を付け、ログインし直した後の画面で案内する（session-input.js） */-->
<main data-session-input="rejected">
    <h1>もう一度ログインしてください</h1>
    <p>一定時間操作がなかったため、ログインの手続き（認証コードの入力や認証アプリの登録）を時間内に終えなかったため、ログインから 8 時間を過ぎたため、password を再設定したため、または認証アプリを登録し直したため、ログアウトしました。もう一度ログインしてください。</p>
    <p>ログインすると、開いていた画面に戻ります。送信していない入力は、サーバーには保存されていません。</p>
    <!-- このタブに入力の控えがあるときだけ、session-input.js が文言を入れる（Bolt 32f） -->
    <p id="session-input-note" data-message="このタブで同じ利用者がログインし直すと、ログアウトの前に入力していた内容を戻します。"></p>
    <p><a th:href="@{/login}">ログインへ</a></p>
    <p>繰り返しログアウトされる場合は、荷主の方は担当営業に、社内の方はシステム管理者にお問い合わせください。</p>
</main>
</body>
</html>
