<!DOCTYPE html>
<!--/* A-05 password の再設定の依頼（US-18 AC8、SEC-08、UI 設計「A-05」。Bolt 33）。入力の形の誤りだけを欄の下に示し、登録の有無は示さない。
       送ると登録の有無にかかわらず A-01 に戻り、同じ知らせが出る。誤りの文言はブラウザの検証でなくサーバーの文言で示す（novalidate） */-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/public :: layout(~{::title}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>password の再設定の依頼 - cargo-tracker</title>
</head>
<body>
<main>
    <h1>password の再設定の依頼</h1>
    <p>登録しているメールアドレスを入力してください。password を再設定するためのリンクを送ります。</p>
    <form th:action="@{/password-reset}" method="post" novalidate>
        <div class="mb-3">
            <label for="email" class="form-label">メールアドレス</label>
            <input type="email" id="email" name="email" class="form-control" autocomplete="email" required
                   th:value="${email}" th:classappend="${emailError != null} ? 'is-invalid'"
                   th:attr="aria-invalid=${emailError != null} ? 'true' : null,aria-describedby=${emailError != null} ? 'email-error' : null">
            <p id="email-error" class="form-text text-danger" th:if="${emailError != null}" th:text="${emailError}">
                メールアドレスを入力してください。</p>
        </div>
        <button type="submit" class="btn btn-primary">再設定のリンクを送る</button>
    </form>
    <p class="mt-4"><a th:href="@{/login}">ログインに戻る</a></p>
</main>
</body>
</html>
