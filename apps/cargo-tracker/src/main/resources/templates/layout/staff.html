<!DOCTYPE html>
<!--/* 社内業務 Web の共通レイアウト（Bolt 8、UI 設計「ナビゲーションとレイアウト」）。画面は次のように使う。
       <html lang="ja" th:replace="~{layout/staff :: layout(~{::title}, ~{::main}, ~{::script}, 'transport-requests')}">（スクリプトがなければ ~{} を渡す）
       ナビには営業担当者の画面を出し、まだ作っていない画面は準備中の画面へつなぐ（Bolt 14）。ほかの役割の画面はその役割の Bolt で足す */-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, scripts, active)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">cargo-tracker</title>
    <th:block th:replace="~{layout/common :: assets(${scripts})}"></th:block>
</head>
<body>
<header class="navbar navbar-expand-md border-bottom app-header">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">cargo-tracker 社内</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#staff-nav"
                aria-controls="staff-nav" aria-expanded="false" aria-label="メニュー">
            <span class="navbar-toggler-icon"></span>
        </button>
        <!-- ログインした利用者の役割名・利用者名とログアウト（Bolt 14、UI 設計「ナビゲーションとレイアウト」） -->
        <div class="d-flex align-items-center gap-3 ms-auto" th:if="${currentActor != null}">
            <p class="navbar-text mb-0 d-none d-md-block">
                <span th:text="${#strings.listJoin(currentActor.roles().![displayName()], '・')}">営業担当者</span>
                <span th:text="${currentActor.displayName()}">営業 一郎</span>
            </p>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <button type="submit" class="btn btn-outline-secondary btn-sm">ログアウト</button>
            </form>
        </div>
    </div>
</header>
<div class="container-fluid">
    <div class="row">
        <nav id="staff-nav" class="col-md-3 col-lg-2 collapse d-md-block app-nav" aria-label="社内業務 Web">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'transport-requests'} ? 'fw-bold'"
                       th:attr="aria-current=${active == 'transport-requests'} ? 'page' : null"
                       th:href="@{/staff/transport-requests}">見積依頼</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'bookings'} ? 'fw-bold'"
                       th:attr="aria-current=${active == 'bookings'} ? 'page' : null"
                       th:href="@{/staff/bookings}">予約</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'kpi-observations'} ? 'fw-bold'"
                       th:attr="aria-current=${active == 'kpi-observations'} ? 'page' : null"
                       th:href="@{/staff/kpi-observations}">KPI 計測記録</a>
                </li>
            </ul>
        </nav>
        <div class="col app-main">
            <main th:replace="${content}"></main>
        </div>
    </div>
</div>
</body>
</html>
