<!DOCTYPE html>
<!--/* session の警告（Bolt 32b、ACC-06、UI 設計の共通部品「session の警告」）。顧客 Web と社内業務 Web のレイアウトの body の最後で
       <th:block th:if="${sessionTimer != null}"><th:block th:replace="~{layout/session-warning :: warning(${sessionTimer})}"></th:block></th:block>
       のように使う（th:replace は th:if より先に評価されるので、条件は外側に置く）。sessionTimer は 2 つの要素のそろった session の
       画面だけにある。残り時間は data- 属性で渡し、/js/session-timeout.js が数える。文言の {minutes} はスクリプトが残りの分に置き換える。
       JavaScript がないときは何も出さない（dialog は開かず、案内は空のまま） */-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="warning(timer)">
    <dialog id="session-warning" class="app-session-warning"
            aria-labelledby="session-warning-title" aria-describedby="session-warning-message"
            th:data-idle-seconds="${timer.idleSeconds()}"
            th:data-lifetime-remaining-seconds="${timer.lifetimeRemainingSeconds()}"
            th:data-return-path="${timer.returnPath()}"
            data-idle-message="画面の移動や送信がないため、あと {minutes}でログアウトします。続けて使う場合は「ログインを延長する」を押してください。"
            data-lifetime-message="ログインから 8 時間になるため、あと {minutes}でログアウトします。延長はできません。入力中の内容は、それまでに送信してください。">
        <h2 id="session-warning-title" class="h5">まもなくログアウトします</h2>
        <p id="session-warning-message"></p>
        <!-- 延長の失敗は role="alert" の要素を差し込んで支援技術に知らせる（見えるようにするだけでは読まれない） -->
        <div id="session-warning-error"></div>
        <form id="session-warning-extend" th:action="@{/session/extend}" method="post" class="d-flex flex-wrap gap-2 mb-0">
            <button type="submit" class="btn btn-primary">ログインを延長する</button>
            <button type="button" class="btn btn-secondary" data-session-warning-close>閉じる</button>
        </form>
    </dialog>
    <template id="session-warning-error-template">
        <p class="text-danger" role="alert">延長できませんでした。もう一度お試しください。続けて失敗する場合は、入力中の内容を控えてから画面を開き直してください。</p>
    </template>
    <!-- 期限の到来の案内。モーダルにせず、背後の画面の入力を控えられるようにする。期限が来たらスクリプトが画面の先頭に移し、
         role="alert" の要素を差し込んで支援技術に知らせる（空の alert の領域を常に置くと、画面のほかの alert と区別しにくくなる） -->
    <div id="session-expired-notice" class="app-session-expired"></div>
    <template id="session-expired-template">
        <div class="alert alert-warning mb-0" role="alert">
            <p class="mb-2">ログアウトした可能性があります。入力中の内容は送信されていません。必要なら控えてから、もう一度ログインしてください。</p>
            <a th:href="@{/session-expired}" class="alert-link" data-session-return>もう一度ログインする</a>
        </div>
    </template>
    <script th:src="@{/js/session-timeout.js}" defer></script>
</th:block>
</body>
</html>
