<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/customer :: layout(~{::title}, ~{::main}, ~{}, 'transport-requests')}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|見積依頼 ${number} - cargo-tracker|">見積依頼 TR-2026-0001 - cargo-tracker</title>
</head>
<body>
<main>
    <h1 th:text="|見積依頼 ${number}|">見積依頼 TR-2026-0001</h1>
    <!-- C-04（Bolt 6）。提出と出し直しの後の PRG のリダイレクト先で、結果を上部に示す（旧 C-03 の提出の完了を統合した）。
         担当営業・見積り・複製・取下げは後の Bolt -->
    <p role="status" th:if="${result}" th:text="${result}">TR-2026-0001 版 1 を提出しました</p>
    <!-- 荷主と社内が言い合える業務番号を示し、内部の ID（UUID）は出さない（D-4） -->
    <dl>
        <dt>業務番号（版）</dt>
        <dd th:text="${numberWithVersion}">TR-2026-0001 版 1</dd>
        <dt>状態</dt>
        <dd th:text="${statusLabel}">審査中（A 社の対応待ち）</dd>
    </dl>
    <p th:text="${guidance}">営業担当者が内容を審査しています。お問い合わせの際は業務番号をお伝えください。</p>

    <!-- 荷主に見せるのは、現在の版への差戻しの理由と不足事項だけ。判断者と審査の確定の根拠は見せない（2026-10-03 の人の決定） -->
    <section th:if="${sendBack}" aria-labelledby="send-back-title">
        <h2 id="send-back-title">差戻し</h2>
        <dl>
            <dt>差戻しの理由</dt>
            <dd th:text="${sendBack.reason()}">目的地の確認が必要</dd>
            <dt>不足事項</dt>
            <dd th:text="${sendBack.missingItems()}">目的地の港</dd>
        </dl>
        <p th:if="${editable}"><a th:href="@{/customer/transport-requests/{number}/edit(number=${number})}">編集して出し直す</a></p>
    </section>

    <!-- 必要書類（Bolt 7）。現在の版の書類だけを示し、ブラウザの中で開かせずダウンロードさせる -->
    <section aria-labelledby="documents-title">
        <h2 id="documents-title">必要書類</h2>
        <p th:if="${#lists.isEmpty(documents)}">添付された書類はありません。</p>
        <div th:unless="${#lists.isEmpty(documents)}" class="table-scroll" tabindex="0" role="region"
             aria-label="必要書類の一覧">
        <table class="table">
            <thead>
            <tr>
                <th scope="col">種類</th>
                <th scope="col">ファイル</th>
                <th scope="col">大きさ</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="document : ${documents}">
                <td th:text="${document.type()}">商業送り状</td>
                <td><a th:href="@{${document.url()}}" th:text="${document.fileName()}" download>invoice.pdf</a></td>
                <td th:text="${document.size()}">120 KB</td>
            </tr>
            </tbody>
        </table>
        </div>
    </section>

    <h2>輸送条件</h2>
    <dl>
        <th:block th:each="term : ${terms}">
            <dt th:text="${term.key}">出発地</dt>
            <dd th:text="${term.value}">JPTYO</dd>
        </th:block>
    </dl>
    <p><a th:href="@{/customer/transport-requests}">見積依頼の一覧へ戻る</a></p>
    <p><a th:href="@{/customer/transport-requests/new}">見積依頼を作成する</a></p>
</main>
</body>
</html>
