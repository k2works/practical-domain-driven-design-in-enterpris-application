<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/customer :: layout(~{::title}, ~{::main}, ~{}, 'transport-requests')}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|見積りへの回答 ${quotationLabel} - cargo-tracker|">見積りへの回答 TR-2026-0001 見積 1 - cargo-tracker</title>
</head>
<body>
<main>
    <h1 th:text="|見積りへの回答 ${quotationLabel}|">見積りへの回答 TR-2026-0001 見積 1</h1>
    <!-- C-05（Bolt 12、US-24 AC1）。料金根拠・有効期限・経路方針を確かめ、詳細経路設計へ進む。辞退・相談（AC2・AC3）は後の Bolt。
         確認の領域は挟まない（この画面自体が確かめる画面。2026-10-06 の決定）。社内承認者は見せない -->
    <dl>
        <dt>状態</dt>
        <dd th:text="${quotation.status()}">提示済み</dd>
    </dl>
    <div th:replace="~{quotation/fragments/quotation :: details(${quotation})}"></div>
    <p>詳細な経路と日程は経路設計者の承認後に確定します。</p>
    <form th:action="@{/customer/transport-requests/{number}/quotations/{no}/response(number=${number},no=${quotation.quotationNo()})}"
          method="post">
        <button type="submit" class="btn btn-primary">この条件で詳細経路設計へ進む</button>
    </form>
    <p>辞退や条件の相談は担当営業にご連絡ください。</p>
    <p><a th:href="@{/customer/transport-requests/{number}(number=${number})}">見積依頼の詳細へ戻る</a></p>
</main>
</body>
</html>
