<!DOCTYPE html>
<!--/* 1 回の送信の合計が multipart の上限（55 MB）を超えたときの案内（Bolt 7、Bolt 6〜8 レビュー R-08・R-35）。
       Bolt 14 で CSRF の確認（Spring Security）が送信の本体を読むようになり、超過はコントローラーより前で起きるため、
       エラーの画面（/error の 413）で示す。荷主の見積依頼への送信と外部データの取込への送信（Bolt 39c2）のときだけ専用の案内を出し、
       ほかは一般の文言にする。業務データを出さないため、認証の前の画面と同じレイアウトにする。取込の上限の数はモデルがないので文に書き、
       取込の規則（IngestionFileLimit）と合うことを ExternalDataUploadLimitIntegrationTest で確かめる */-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/public :: layout(~{::title}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>送信が大きすぎます - cargo-tracker</title>
</head>
<body>
<!--/* 送信が拒まれた画面の印（Bolt 32f。session-input.js） */-->
<main data-session-input="rejected"
      th:with="transportRequest=${path != null and #strings.startsWith(path, '/customer/transport-requests')},
               ingestion=${path != null and #strings.startsWith(path, '/staff/external-data/ingestions')}">
    <th:block th:if="${transportRequest}">
        <h1>送信したファイルが大きすぎます</h1>
        <!-- 入力はブラウザの「戻る」で残っていることが多い -->
        <p>書類は 1 件 10 MB まで、1 つの版に 5 件までです。1 回に送れるのは合計 55 MB までです。ブラウザの「戻る」で入力の画面に戻り、ファイルを選び直してください。</p>
        <p><a th:href="@{/customer/transport-requests}">見積依頼の一覧へ</a></p>
    </th:block>
    <th:block th:if="${ingestion}">
        <h1>取込ファイルが大きすぎます</h1>
        <p>1 ファイルにつきデータ行 10,000 行・40 MB までです。ブラウザの「戻る」で外部データの取込の画面に戻り、ファイルを分けて取り込んでください。</p>
        <p><a th:href="@{/staff/external-data/ingestions/new}">外部データの取込へ</a></p>
    </th:block>
    <th:block th:unless="${transportRequest or ingestion}">
        <h1>送信が大きすぎます</h1>
        <p>1 回に送れる大きさの上限を超えました。ブラウザの「戻る」で前の画面に戻ってください。</p>
        <p><a th:href="@{/}">ホームへ戻る</a></p>
    </th:block>
</main>
</body>
</html>
