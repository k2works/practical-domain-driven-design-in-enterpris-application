spring.application.name=cargo-tracker

# Flyway: 業務の表（common）とフレームワークの表（{vendor}）を 1 回の実行で適用する（ADR-007）
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor},classpath:db/callback/{vendor}
# afterMigrate のコールバックが権限を与えるアプリケーション利用者（運用要件 DA-02）。環境ごとに変えられる
spring.flyway.placeholders.appuser=cargo_tracker_app
# アプリケーション利用者がないときにマイグレーションを失敗させるか。ステージング・本番では true にする（DA-02）
spring.flyway.placeholders.requireappuser=false

# Spring Modulith のイベント発行記録は platform スキーマに置く（データモデル）
spring.modulith.events.jdbc.schema=platform
# スキーマと表は Flyway だけが作る。Spring Modulith 2.1 はこの設定がないと起動時に CREATE SCHEMA を実行し、
# 最小の権限のアプリケーション利用者では起動に失敗する（データモデル「マイグレーションの構成」）
spring.modulith.events.jdbc.schema-initialization.enabled=false

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.example.cargotracker.platform.mybatis

# 認証を入れるまでの仮の主体（Bolt 1。US-18 の Bolt で認証の主体に置き換える）
cargotracker.provisional-actor.shipper-company-id=00000000-0000-0000-0000-000000000001
cargotracker.provisional-actor.user-id=00000000-0000-0000-0000-000000000101

# 企業マスターができるまでの仮の荷受人の一覧（Bolt 4 の確認ポイント 2。US-16 の Bolt で企業マスターに置き換える）
# .properties は ISO-8859-1 で読まれるため、名前の日本語は Unicode のエスケープで書く（荷受人 A（仮）など）
cargotracker.provisional-consignees.companies[0].id=00000000-0000-0000-0000-000000000201
cargotracker.provisional-consignees.companies[0].name=\u8377\u53D7\u4EBA A\uFF08\u4EEE\uFF09
cargotracker.provisional-consignees.companies[1].id=00000000-0000-0000-0000-000000000202
cargotracker.provisional-consignees.companies[1].name=\u8377\u53D7\u4EBA B\uFF08\u4EEE\uFF09
cargotracker.provisional-consignees.companies[2].id=00000000-0000-0000-0000-000000000203
cargotracker.provisional-consignees.companies[2].name=\u8377\u53D7\u4EBA C\uFF08\u4EEE\uFF09
