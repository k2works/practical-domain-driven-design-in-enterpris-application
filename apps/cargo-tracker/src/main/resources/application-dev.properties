# ローカル起動（./gradlew bootRun）用。H2 を PostgreSQL 互換モードで使う（ADR-007）
spring.datasource.url=jdbc:h2:mem:cargotracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# 開発用の企業と利用者（db/dev-data）を dev のときだけ足す（ADR-011 の決定 3、ADR-012。既定の設定には含めない）
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor},classpath:db/callback/{vendor},classpath:db/dev-data
# TOTP の秘密の暗号化の鍵（SEC-16、Bolt 31）。開発用の固定の鍵で、本物の秘密ではない（ASCII の
# "dev-only-totp-secret-key-not-sec"）。db/dev-data の TOTP の資格の暗号文はこの鍵で作る。本番は環境変数で渡す
cargotracker.totp-secret-keys.v1=ZGV2LW9ubHktdG90cC1zZWNyZXQta2V5LW5vdC1zZWM=
# http の bootRun でも session の Cookie を送れるよう、dev だけ Secure を外す（SEC-17）
server.servlet.session.cookie.secure=false
# 開発体験を優先し、A-01 を最初の開発用の利用者（荷主）で入力済みにし、荷主担当者・営業担当者の開発用の利用者を選んで
# そのままログインできるようにする（2026-10-06 の人の決定、ADR-011 の決定 3）。値は db/dev-data の利用者と同じ固定の値。
# A-02 は totp-secret（Base32。利用者ごとに別の開発用の固定の値）からその時点のコードで入力済みにする（Bolt 31。TOTP を飛ばさない）。
# 同じ秘密を db/dev-data の暗号文にも置く（一致は DevTotpCredentialsDevProfileTest で確かめる）
# dev の外にこの設定があると起動しない（DevLoginGuard）
cargotracker.dev-login.accounts[0].role=SHIPPER
cargotracker.dev-login.accounts[0].email=shipper@dev.cargo-tracker.example
cargotracker.dev-login.accounts[0].password=dev-password-shipper
