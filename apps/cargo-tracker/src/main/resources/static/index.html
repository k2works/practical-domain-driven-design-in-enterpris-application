<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cargo-tracker</title>
    <style>
        /* 並んだリンクは押せる範囲を 24 CSS px 以上にし、間隔も取る（WCAG 2.2 の 2.5.8 target-size）。
           文字の行の高さは OS で違い、Linux の CI では 24 px に届かなかった（Bolt 5）。UI の骨格（#36）で共通の CSS に移す */
        li + li { margin-top: 8px; }
        li a { display: inline-block; min-height: 24px; line-height: 24px; }
    </style>
</head>
<body>
<main>
    <h1>cargo-tracker</h1>
    <!-- 画面の入口の一覧（2026-10-02 の人の決定）。認証（US-18）を入れたら、ログインの画面に置き換える -->
    <p>使う画面を選んでください。</p>
    <h2>荷主の画面</h2>
    <ul>
        <li><a href="/customer/transport-requests/new">見積依頼の作成</a></li>
    </ul>
    <h2>社内の画面</h2>
    <ul>
        <li><a href="/staff/transport-requests">見積依頼の受付一覧</a></li>
        <li><a href="/staff/kpi-observations">KPI 計測記録の一覧</a></li>
    </ul>
</main>
</body>
</html>
