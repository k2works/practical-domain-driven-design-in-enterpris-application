# IDE から .feature・シナリオを直接実行する（Cucumber CLI）ときの既定のグルー。
# RunCucumberTest の GLUE_PROPERTY_NAME と同じ業務ルール層のパッケージに絞る。
# 画面の層（com.example.cargotracker.ui）を含めると @CucumberContextConfiguration が 2 つになり失敗する。
# JUnit Platform の実行（RunCucumberTest・RunUiCucumberTest）はこのファイルを読まず、Suite の設定に従う。
cucumber.glue=com.example.cargotracker.acceptance,com.example.cargotracker.shared.acceptance,\
  com.example.cargotracker.quotation.acceptance,com.example.cargotracker.identity.acceptance,\
  com.example.cargotracker.routing.acceptance,com.example.cargotracker.booking.acceptance,\
  com.example.cargotracker.tracking.acceptance
