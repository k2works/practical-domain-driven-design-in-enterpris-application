plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.3'
	id 'checkstyle'
	id 'jacoco'
	id 'com.github.spotbugs' version '6.5.12'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'A 社国際貨物輸送管理システム（cargo-tracker）'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	// Spring Boot の BOM が管理しないものだけ版を指定する（技術スタック「版は BOM に任せる」）
	set('springModulithVersion', '2.1.1')
	set('cucumberVersion', '8.0.3')
	set('mybatisVersion', '4.1.0')
	set('archunitVersion', '1.5.1')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisVersion}"
	implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.springframework.modulith:spring-modulith-runtime'

	// 開発体験を優先し、ローカル起動だけ H2 を使う。本番の成果物には含めない（ADR-007、AT-06）
	developmentOnly 'com.h2database:h2'
	developmentOnly 'org.springframework.boot:spring-boot-h2console'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation "org.mybatis.spring.boot:mybatis-spring-boot-starter-test:${mybatisVersion}"
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	// イベントの直列化の契約テストで、Spring Modulith の EventSerializer を直接使う
	testImplementation 'org.springframework.modulith:spring-modulith-events-core'
	testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
	testImplementation 'io.cucumber:cucumber-java'
	testImplementation 'io.cucumber:cucumber-spring'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine'
	testImplementation 'org.junit.platform:junit-platform-suite'
	// H2 のスモークテスト（テスト戦略）で dev プロファイルの起動とマイグレーションを確かめる。本番の成果物には含めない
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
		mavenBom "io.cucumber:cucumber-bom:${cucumberVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// 受入シナリオは RunCucumberTest（Suite）からだけ実行し、Cucumber エンジンの直接探索による二重実行を防ぐ
	systemProperty 'cucumber.junit-platform.discovery.as-root-engine', 'false'
}

tasks.named('bootRun') {
	// ローカル起動は H2 の dev プロファイルで動かす（開発体験を優先する。ADR-007）
	systemProperty 'spring.profiles.active', 'dev'
}

// 書式（Bolt 1 レビュー R-31）。既存の書き方（4 スペース、120 桁）に近い palantir-java-format を使う
spotless {
	java {
		target 'src/**/*.java'
		palantirJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// 静的解析（技術スタック）。規則は最小から始め、指摘は直す。抑止するときは理由を書く
checkstyle {
	toolVersion = '14.3.0'
	configFile = file('config/checkstyle/checkstyle.xml')
	maxWarnings = 0
}

spotbugs {
	toolVersion = '4.10.4'
	effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
	reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
	excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		html.required = true
	}
}

// テストコードの SpotBugs は、Mockito のスタブなど意図した書き方の指摘が多いため本体だけを検査する
tasks.named('spotbugsTest') {
	enabled = false
}

// AT-06: 本番の実行クラスパスに H2・Hibernate ORM・JPA を含めない（ADR-007、テスト戦略）。
// bootJar が使う productionRuntimeClasspath を検査する（runtimeClasspath は bootRun 用に developmentOnly を含む）
def forbiddenInProduction = ['com.h2database:h2', 'org.hibernate.orm:hibernate-core', 'jakarta.persistence:jakarta.persistence-api']
tasks.register('verifyProductionClasspath') {
	group = 'verification'
	description = 'AT-06: 本番の実行クラスパスに H2・Hibernate ORM・JPA が含まれないことを確かめる'
	def runtimeModules = configurations.productionRuntimeClasspath.incoming.resolutionResult.rootComponent.map { root ->
		def modules = [] as Set
		def visit
		visit = { component ->
			component.dependencies.each { dependency ->
				if (dependency instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult) {
					def selected = dependency.selected
					def id = selected.moduleVersion
					if (id != null && modules.add("${id.group}:${id.name}".toString())) {
						visit(selected)
					}
				}
			}
		}
		visit(root)
		modules
	}
	inputs.property('runtimeModules', runtimeModules)
	doLast {
		def found = runtimeModules.get().findAll { forbiddenInProduction.contains(it) }
		if (!found.isEmpty()) {
			throw new GradleException("本番の実行クラスパスに含めてはいけない依存があります: ${found}")
		}
	}
}

tasks.named('check') {
	dependsOn 'verifyProductionClasspath'
}

// カバレッジ（テスト戦略）。目標値と分け、最初の閾値をレイヤーごとに検証する。閾値は実績に合わせて段階的に目標へ上げる
jacoco {
	toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
	dependsOn 'test'
	reports {
		xml.required = true
		html.required = true
	}
}

def coverageThresholds = [
	// レイヤー: [対象のクラス, 行の閾値, 分岐の閾値（null は検証しない）]
	domain        : ['com/example/cargotracker/**/domain/**', 0.85, 0.75],
	application   : ['com/example/cargotracker/**/application/**', 0.80, 0.65],
	interfaces    : ['com/example/cargotracker/**/interfaces/**', 0.65, null],
	infrastructure: ['com/example/cargotracker/**/infrastructure/**', 0.70, null],
	overall       : ['com/example/cargotracker/**', 0.75, 0.65],
]

def layerVerifications = coverageThresholds.collect { layer, threshold ->
	def (pattern, lineMinimum, branchMinimum) = threshold
	tasks.register("jacocoCoverageVerification${layer.capitalize()}", JacocoCoverageVerification) {
		group = 'verification'
		description = "カバレッジの閾値（${layer}）を検証する"
		dependsOn 'test'
		executionData.from(tasks.named('test').map { it.extensions.getByType(JacocoTaskExtension).destinationFile })
		sourceDirectories.from(sourceSets.main.allJava.srcDirs)
		classDirectories.from(sourceSets.main.output.classesDirs.asFileTree.matching { include pattern })
		violationRules {
			rule {
				limit {
					counter = 'LINE'
					minimum = lineMinimum
				}
				if (branchMinimum != null) {
					limit {
						counter = 'BRANCH'
						minimum = branchMinimum
					}
				}
			}
		}
	}
}

tasks.named('check') {
	dependsOn 'jacocoTestReport'
	dependsOn layerVerifications
}
