site_name: 実践ドメイン駆動設計 in エンタープライズアプリケーション
site_description: ドメイン駆動設計をエンタープライズアプリケーション開発で実践するプロジェクト
site_author: k2works
repo_url: https://github.com/k2works/practical-domain-driven-design-in-enterpris-application
repo_name: practical-domain-driven-design-in-enterpris-application

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist
  - pymdownx.emoji
  - admonition
  - toc:
      permalink: true
  - plantuml_markdown:
      server: !!python/object/apply:os.getenv
        - PLANTUML_SERVER_URL
        - http://www.plantuml.com/plantuml
      format: svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js
  - assets/js/extra.js
  # 数式（MathJax 3）。設定を先に読み込んでから MathJax 本体を読み込む
  - assets/js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  plantuml_url: http://www.plantuml.com/plantuml
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/k2works
      name: GitHub Repository/practical-domain-driven-design-in-enterpris-application

plugins:
  - search

exclude_docs: |
  wiki

