name: cargo-tracker CI

# テスト戦略「CI での実行」のうち、配備の前までを実行する。
# ステージング・本番への配備は運用準備で足す。デモ環境（Heroku、ADR-013）へは、develop の check・ui が緑になった後に
# deploy-demo ジョブが配備する（Bolt 16）。画面の層の受入シナリオ（@ui）は、ステージングができるまでアプリを CI の中で起動して ui ジョブで動かす。
# アクションはタグを付け替えられても中身が変わらないよう、コミットの SHA で固定する（末尾のコメントは版）。
on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/cargo-tracker/**'
      # 用語集の整合テストが読む設計文書
      - 'docs/design/cargo-tracker/**'
      - '.github/workflows/cargo-tracker-ci.yml'
  pull_request:
    paths:
      - 'apps/cargo-tracker/**'
      # 用語集の整合テストが読む設計文書
      - 'docs/design/cargo-tracker/**'
      - '.github/workflows/cargo-tracker-ci.yml'
  # develop で手で配備し直すとき（deploy-demo は develop でだけ動く）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-tracker-ci-${{ github.ref }}
  # main ではコミットごとの結果を残すため、実行中のものを取り消さない
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: apps/cargo-tracker

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 25（Corretto）を用意する
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '25'

      - name: Gradle を用意する
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # テスト戦略: @wip は必須の実行から外し（RunCucumberTest の not @wip）、@wip を残したまま Bolt を完了しない。
      # 失敗するシナリオを先に push できるよう、develop と Pull Request では警告にとどめ、main への push では失敗にする
      - name: 作業中（@wip）の受入シナリオを確かめる
        env:
          FAIL_ON_WIP: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ ! -d src/test/resources/features ]; then
            echo '::error::src/test/resources/features がありません（@wip を検出できません）'
            exit 1
          fi
          set +e
          grep -rnE --include='*.feature' '(^|[[:space:]])@wip([[:space:]]|$)' src/test/resources/features
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo '::error::@wip の検出に失敗しました'
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            if [ "$FAIL_ON_WIP" = 'true' ]; then
              echo '::error::@wip のシナリオが残っています（テスト戦略: @wip を残したまま Bolt を完了しない）'
              exit 1
            fi
            echo '::warning::@wip のシナリオがあります。必須の実行から外れています。Bolt を完了する前に外してください'
          fi

      - name: 書式・静的解析・テスト・アーキテクチャ・本番の依存・カバレッジを検証する
        run: ./gradlew check

      # 生きたドキュメント（開発戦略）。Spring Modulith の図は check のテストで生成される
      - name: JIG の設計ドキュメントを生成する
        run: ./gradlew jigReports

      - name: テストとカバレッジと受入シナリオの結果を保存する
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-tracker-reports
          path: |
            apps/cargo-tracker/build/reports/
            apps/cargo-tracker/build/test-results/
            apps/cargo-tracker/build/jig/
            apps/cargo-tracker/build/spring-modulith-docs/
          retention-days: 14

  ui:
    # 画面の層の受入シナリオ（@ui）。Playwright の Chromium と axe-core で、画面の流れとアクセシビリティを確かめる（テスト戦略）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 25（Corretto）を用意する
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '25'

      - name: Gradle を用意する
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Playwright のブラウザのキャッシュを使う
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/cargo-tracker/build.gradle') }}

      - name: Playwright の Chromium と OS の依存を入れる
        run: ./gradlew playwrightInstall

      - name: 画面の層の受入シナリオ（@ui）を動かす
        run: ./gradlew uiTest

      - name: 画面の層の受入シナリオの結果を保存する
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-tracker-ui-reports
          path: |
            apps/cargo-tracker/build/reports/cucumber-ui/
            apps/cargo-tracker/build/reports/tests/uiTest/
            apps/cargo-tracker/build/test-results/uiTest/
          retention-days: 14

  deploy-demo:
    # デモ環境（Heroku、ADR-013）へ配備する。check・ui が緑の develop のコミットだけを出す（手元の deploy:demo のガードと同じ約束）。
    # API キーは Environment demo（配備のブランチは develop だけ）の secret に人が置く。キー・Config Vars の値・API の応答の本文はログに出さない
    needs: [check, ui]
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: demo
      url: https://cargo-tracker-mono-demo-883bf0b92807.herokuapp.com/
    concurrency:
      group: cargo-tracker-demo-deploy
      cancel-in-progress: false
    env:
      HEROKU_APP: cargo-tracker-mono-demo
      DEMO_URL: https://cargo-tracker-mono-demo-883bf0b92807.herokuapp.com
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Buildx を用意する
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Heroku の Container Registry にログインする
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      # Heroku の Container Registry は Docker v2 の manifest だけを受けるため、attestation を外し OCI の media type を使わない（ADR-013）
      - name: デモのイメージをビルドして push する
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/cargo-tracker
          target: demo
          platforms: linux/amd64
          provenance: false
          sbom: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=registry.heroku.com/${{ env.HEROKU_APP }}/web,push=true,oci-mediatypes=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Heroku CLI はランナーにないため、Platform API で release する（formation の更新）。続けて動いているコミットを DEMO_REVISION に残す
      - name: Heroku に release し、DEMO_REVISION を残す
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error --output /dev/null -X PATCH "https://api.heroku.com/apps/${HEROKU_APP}/$1" \
              -H "Authorization: Bearer ${HEROKU_API_KEY}" -H "Content-Type: application/json" -H "Accept: $2" -d "$3"
          }
          api formation 'application/vnd.heroku+json; version=3.docker-releases' \
            "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"${IMAGE_ID}\"}]}"
          api config-vars 'application/vnd.heroku+json; version=3' "{\"DEMO_REVISION\":\"${REVISION}\"}"
          echo "release した: ${REVISION}"

      # formation の更新はすぐ応答し、新しい dyno が上がるまでは古い dyno が応答する。最新の release の dyno が up になるのを待ってから確かめる
      - name: 最新の release の dyno が up になり、ログインの画面が開けることを確かめる
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -euo pipefail
          get() {
            curl --fail --silent --show-error "https://api.heroku.com/apps/${HEROKU_APP}/$1" \
              -H "Authorization: Bearer ${HEROKU_API_KEY}" -H 'Accept: application/vnd.heroku+json; version=3' "${@:2}"
          }
          latest=$(get releases -H 'Range: version ..; order=desc, max=1' | jq -r '.[0].version')
          echo "最新の release: v${latest}"
          for i in $(seq 1 36); do
            state=$(get dynos | jq -r --argjson v "$latest" '[.[] | select(.type == "web" and .release.version == $v)][0].state // "none"')
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' "${DEMO_URL}/login" || true)
            if [ "$state" = 'up' ] && [ "$code" = '200' ]; then
              echo "v${latest} の dyno が up で、/login が 200（${i} 回目）"
              exit 0
            fi
            sleep 5
          done
          echo "::error::配備の後 180 秒たっても v${latest} の dyno が up にならないか、/login が 200 になりません（state=${state}、code=${code}。deploy:demo:logs で確かめてください）"
          exit 1
