<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2253" height="1601" viewBox="0 0 2253 1601" role="img" aria-labelledby="title desc">
  <title id="title">A 社のビジネスモデルキャンバス</title>
  <desc id="desc">国際貨物輸送会社 A 社の主要パートナー、主要活動、主要リソース、価値提案、顧客関係、チャネル、顧客セグメント、コスト構造、収益源を示す。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#263238" flood-opacity="0.16"/>
    </filter>
    <style>
      .canvas { fill: #FAFAFA; }
      .block { fill: #FFFFFF; stroke: #455A64; stroke-width: 2; }
      .block-alt { fill: #F7FAFC; stroke: #455A64; stroke-width: 2; }
      .header { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; font-size: 27px; font-weight: 700; fill: #263238; }
      .subheader { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; font-size: 16px; fill: #607D8B; }
      .title { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; font-size: 38px; font-weight: 700; fill: #1F2933; }
      .subtitle { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; font-size: 17px; fill: #607D8B; }
      .card { fill: #FFF9C4; stroke: #E0D654; stroke-width: 1.5; rx: 10; filter: url(#shadow); }
      .card-accent { fill: #FFF3A3; stroke: #D4C641; stroke-width: 1.5; rx: 10; filter: url(#shadow); }
      .item { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; font-size: 18px; font-weight: 600; fill: #37474F; }
      .note { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; font-size: 14px; fill: #666666; }
      .credit { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; font-size: 13px; fill: #78909C; }
    </style>
  </defs>

  <rect class="canvas" width="2253" height="1601"/>
  <text class="title" x="36" y="52">A 社のビジネスモデルキャンバス</text>
  <text class="subtitle" x="36" y="82">複雑な国際貨物輸送を、専門性とデジタルの融合によって安全・迅速・透明にする</text>

  <!-- 上段 5 列 -->
  <rect class="block-alt" x="30" y="100" width="425" height="900"/>
  <rect class="block" x="455" y="100" width="430" height="450"/>
  <rect class="block-alt" x="455" y="550" width="430" height="450"/>
  <rect class="block" x="885" y="100" width="483" height="900"/>
  <rect class="block-alt" x="1368" y="100" width="430" height="450"/>
  <rect class="block" x="1368" y="550" width="430" height="450"/>
  <rect class="block-alt" x="1798" y="100" width="425" height="900"/>

  <!-- 下段 2 列 -->
  <rect class="block" x="30" y="1000" width="1096" height="550"/>
  <rect class="block-alt" x="1126" y="1000" width="1097" height="550"/>

  <!-- 主要パートナー -->
  <text class="header" x="55" y="145">🤝 主要パートナー</text>
  <text class="subheader" x="55" y="174">Key Partners</text>
  <rect class="card" x="55" y="205" width="375" height="100"/>
  <text class="item" x="78" y="250">運送会社</text>
  <text class="note" x="78" y="278">航海・陸上輸送を担う協業先</text>
  <rect class="card" x="55" y="330" width="375" height="100"/>
  <text class="item" x="78" y="375">港湾管理者</text>
  <text class="note" x="78" y="403">港湾・荷役情報を連携</text>
  <rect class="card" x="55" y="455" width="375" height="100"/>
  <text class="item" x="78" y="500">税関</text>
  <text class="note" x="78" y="528">規制・申告情報を連携</text>
  <rect class="card" x="55" y="580" width="375" height="100"/>
  <text class="item" x="78" y="625">決済機関</text>
  <text class="note" x="78" y="653">安全な料金決済を支援</text>

  <!-- 主要活動 -->
  <text class="header" x="480" y="145">⚙ 主要活動</text>
  <text class="subheader" x="480" y="174">Key Activities</text>
  <rect class="card" x="480" y="200" width="380" height="68"/>
  <text class="item" x="502" y="242">見積り・予約受付</text>
  <rect class="card-accent" x="480" y="282" width="380" height="68"/>
  <text class="item" x="502" y="324">経路設計</text>
  <rect class="card" x="480" y="364" width="380" height="68"/>
  <text class="item" x="502" y="406">荷役・輸送</text>
  <rect class="card-accent" x="480" y="446" width="380" height="68"/>
  <text class="item" x="502" y="488">追跡・例外対応・精算</text>

  <!-- 主要リソース -->
  <text class="header" x="480" y="595">🏭 主要リソース</text>
  <text class="subheader" x="480" y="624">Key Resources</text>
  <rect class="card-accent" x="480" y="650" width="380" height="72"/>
  <text class="item" x="502" y="694">熟練した経路設計者</text>
  <rect class="card" x="480" y="738" width="380" height="72"/>
  <text class="item" x="502" y="782">国際物流の実務知識</text>
  <rect class="card" x="480" y="826" width="380" height="72"/>
  <text class="item" x="502" y="870">取引先との継続関係</text>
  <rect class="card-accent" x="480" y="914" width="380" height="62"/>
  <text class="item" x="502" y="944">輸送実績データ</text>
  <text class="note" x="702" y="944">潜在資源</text>

  <!-- 価値提案 -->
  <text class="header" x="910" y="145">🎁 価値提案</text>
  <text class="subheader" x="910" y="174">Value Propositions</text>
  <rect class="card-accent" x="915" y="215" width="423" height="130"/>
  <text class="item" x="940" y="264">安全性と期日遵守</text>
  <text class="note" x="940" y="297">信頼の基盤となる輸送品質</text>
  <rect class="card-accent" x="915" y="375" width="423" height="150"/>
  <text class="item" x="940" y="425">複雑な制約に対応した</text>
  <text class="item" x="940" y="456">経路提案</text>
  <text class="note" x="940" y="491">危険物・冷凍貨物にも対応</text>
  <rect class="card" x="915" y="555" width="423" height="130"/>
  <text class="item" x="940" y="604">一貫した顧客体験</text>
  <text class="note" x="940" y="637">見積りから精算まで支援</text>
  <rect class="card-accent" x="915" y="715" width="423" height="150"/>
  <text class="item" x="940" y="765">輸送状況の透明性</text>
  <text class="note" x="940" y="800">リアルタイム追跡・通知</text>
  <text class="note" x="940" y="827">例外時も同じ事実を共有</text>

  <!-- 顧客関係 -->
  <text class="header" x="1393" y="145">❤ 顧客関係</text>
  <text class="subheader" x="1393" y="174">Customer Relationships</text>
  <rect class="card" x="1393" y="205" width="380" height="82"/>
  <text class="item" x="1415" y="254">法人継続契約</text>
  <rect class="card" x="1393" y="305" width="380" height="82"/>
  <text class="item" x="1415" y="354">個別要望への柔軟な対応</text>
  <rect class="card-accent" x="1393" y="405" width="380" height="105"/>
  <text class="item" x="1415" y="449">状態通知と例外時の支援</text>
  <text class="note" x="1415" y="480">セルフサービスと人的支援を両立</text>

  <!-- チャネル -->
  <text class="header" x="1393" y="595">🚚 チャネル</text>
  <text class="subheader" x="1393" y="624">Channels</text>
  <rect class="card" x="1393" y="665" width="380" height="82"/>
  <text class="item" x="1415" y="714">営業担当者</text>
  <rect class="card" x="1393" y="765" width="380" height="82"/>
  <text class="item" x="1415" y="814">カスタマーサポート</text>
  <rect class="card-accent" x="1393" y="865" width="380" height="95"/>
  <text class="item" x="1415" y="908">Web サービス</text>
  <text class="note" x="1415" y="936">予約・追跡・通知（計画）</text>

  <!-- 顧客セグメント -->
  <text class="header" x="1823" y="145">👥 顧客セグメント</text>
  <text class="subheader" x="1823" y="174">Customer Segments</text>
  <rect class="card" x="1823" y="215" width="375" height="110"/>
  <text class="item" x="1845" y="261">製造業の法人荷主</text>
  <text class="note" x="1845" y="293">国際調達・輸出入を行う企業</text>
  <rect class="card" x="1823" y="350" width="375" height="110"/>
  <text class="item" x="1845" y="396">卸売業の法人荷主</text>
  <text class="note" x="1845" y="428">納期と可視性を重視</text>
  <rect class="card-accent" x="1823" y="485" width="375" height="140"/>
  <text class="item" x="1845" y="531">複雑貨物の荷主</text>
  <text class="note" x="1845" y="565">一般・危険物・冷凍貨物</text>
  <text class="note" x="1845" y="594">複数制約への対応を必要とする</text>
  <rect class="card" x="1823" y="650" width="375" height="110"/>
  <text class="item" x="1845" y="696">荷受人</text>
  <text class="note" x="1845" y="728">到着予定と状態を確認</text>

  <!-- コスト構造 -->
  <text class="header" x="55" y="1048">💰 コスト構造</text>
  <text class="subheader" x="55" y="1077">Cost Structure</text>
  <rect class="card" x="60" y="1120" width="480" height="135"/>
  <text class="item" x="87" y="1170">輸送・荷役関連費</text>
  <text class="note" x="87" y="1205">運送委託、荷役作業、設備利用</text>
  <rect class="card" x="575" y="1120" width="480" height="135"/>
  <text class="item" x="602" y="1170">港湾利用料</text>
  <text class="note" x="602" y="1205">港湾・施設の利用に伴う費用</text>
  <rect class="card" x="60" y="1290" width="480" height="135"/>
  <text class="item" x="87" y="1340">人件費</text>
  <text class="note" x="87" y="1375">営業・運用・現場・管理の専門人材</text>
  <rect class="card-accent" x="575" y="1290" width="480" height="135"/>
  <text class="item" x="602" y="1340">IT 構築・運用費</text>
  <text class="note" x="602" y="1375">段階導入と外部システム連携</text>

  <!-- 収益源 -->
  <text class="header" x="1151" y="1048">💵 収益源</text>
  <text class="subheader" x="1151" y="1077">Revenue Streams</text>
  <rect class="card-accent" x="1166" y="1135" width="480" height="185"/>
  <text class="item" x="1193" y="1191">輸送料金</text>
  <text class="note" x="1193" y="1228">貨物仕様・経路・期限に応じた料金</text>
  <text class="note" x="1193" y="1260">主要な取引単位の収益</text>
  <rect class="card" x="1680" y="1135" width="480" height="185"/>
  <text class="item" x="1707" y="1191">法人契約料金</text>
  <text class="note" x="1707" y="1228">継続契約・取引条件に基づく料金</text>
  <text class="note" x="1707" y="1260">安定的な顧客関係を形成</text>
  <rect class="card" x="1166" y="1360" width="994" height="100"/>
  <text class="item" x="1193" y="1404">成長ドライバー</text>
  <text class="note" x="1380" y="1404">回答時間短縮による成約率向上と、透明性向上による継続率向上</text>

